name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # npm provenance, and npm Trusted Publishing once configured
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # The tag must match package.json, so a release can't publish the wrong version.
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      # With a Trusted Publisher configured on npmjs.com, NPM_TOKEN can be
      # removed: npm authenticates with the workflow's OIDC token instead.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
