name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # npm provenance, and npm Trusted Publishing once configured
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # The tag must match package.json, so a release can't publish the wrong version.
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      # npm Trusted Publishing: npm authenticates with this workflow's OIDC
      # token (id-token: write above), so no NPM_TOKEN secret is stored. Set up
      # once per package on npmjs.com → package → Settings → Trusted publisher.
      # Re-running a release, or releasing a version first published by hand,
      # shouldn't fail on "cannot publish over an existing version".
      - id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"; echo "Already on npm; skipping publish."
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
